name: cloud-base image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/cloud-base/**
      - .github/workflows/cloud-base.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-base
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yeshuman-io/cloud-base
  MAJOR: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Date tag
        id: tag
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: images/cloud-base
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.MAJOR }}
            ${{ env.IMAGE }}:${{ env.MAJOR }}.${{ steps.tag.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
