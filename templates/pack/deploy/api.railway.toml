# Railway config-as-code for <handle>-api (service setting: config file deploy/api.railway.toml).
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/api.Dockerfile"

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 600
healthcheckInterval = 30
restartPolicyType = "ON_FAILURE"
# Start command is the Dockerfile CMD (a shell, so $PORT expands).
preDeployCommand = "python manage.py migrate && python manage.py bootstrap_tenant"
